name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Publish deploy branch
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          rm -rf node_modules tests .github

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan deploy
          git add -A
          git add -f vendor public/build
          git commit -m "deploy: build from main@${SHORT_SHA}"
          git push origin deploy --force

      # hPanel Git Deploy menarik branch "deploy" otomatis, tapi itu cuma
      # menyalin file -- tidak menjalankan migrasi. Langkah ini SSH ke
      # Hostinger, pastikan public_html/public benar-benar sudah di commit
      # "deploy" terbaru (tidak bergantung timing webhook hPanel), lalu
      # jalankan migrate supaya skema DB ikut up-to-date setiap push ke main.
      - name: Run migrations on Hostinger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd public_html/public
            git fetch origin deploy
            git reset --hard origin/deploy
            php artisan migrate --force
